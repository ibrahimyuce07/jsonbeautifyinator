<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>JSON Beautifyinator - Full Workspace</title>
    <link rel="stylesheet" href="editor.css" />
</head>

<body class="theme-dark">
    <!-- Main App Wrap -->
    <div class="workspace-wrapper">
        
        <!-- Header Panel -->
        <header class="workspace-header">
            <div class="header-left">
                <svg class="header-logo" viewBox="0 0 24 24" width="28" height="28">
                    <path fill="currentColor" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h14V5H5zm2 3h10v2H7V8zm0 4h10v2H7v-2zm0 4h7v2H7v-2z"/>
                </svg>
                <h1 class="header-title">JSON Beautifyinator <span class="badge">Pro Workspace</span></h1>
            </div>
            
            <div class="header-right">
                <!-- Spacing Settings -->
                <div class="control-group">
                    <label for="spacing-select">Indent:</label>
                    <select id="spacing-select" class="styled-select">
                        <option value="2">2 Spaces</option>
                        <option value="4" selected>4 Spaces</option>
                        <option value="tab">Tabs</option>
                    </select>
                </div>

                <!-- Theme Settings -->
                <div class="control-group">
                    <label for="theme-select">Theme:</label>
                    <select id="theme-select" class="styled-select">
                        <option value="theme-dark">Glass Dark</option>
                        <option value="theme-light">Glass Light</option>
                        <option value="theme-cyberpunk">Cyberpunk</option>
                        <option value="theme-monochrome">Monochrome</option>
                    </select>
                </div>

                <!-- Actions -->
                <button id="toggle-history" class="header-btn" title="View Format History">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1L4.89 16.39l.1.07L9 12H6a7 7 0 1 1 7 7 7 7 0 0 1-5-2.09l-1.42 1.42A8.93 8.93 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/>
                    </svg>
                    <span>History</span>
                </button>
            </div>
        </header>

        <!-- Main Body -->
        <main class="workspace-main">
            <!-- Left Pane: Input -->
            <section class="pane left-pane" id="input-pane">
                <div class="pane-header">
                    <div class="pane-title-group">
                        <span class="pane-number">01</span>
                        <h2>JSON Input</h2>
                    </div>
                    <div class="pane-actions">
                        <button id="load-sample" class="action-link">Load Sample</button>
                        <button id="sort-keys" class="action-btn" title="Sort JSON Keys Alphabetically">
                            <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
                            Sort Keys
                        </button>
                        <button id="escape-json" class="action-btn" title="Escape JSON string">Escape</button>
                        <button id="unescape-json" class="action-btn" title="Unescape JSON string">Unescape</button>
                        <button id="clear-workspace" class="action-btn-danger" title="Clear all text">Clear</button>
                    </div>
                </div>
                
                <div class="editor-container drag-zone" id="input-drag-zone">
                    <div class="line-numbers" id="input-line-numbers"><div>1</div></div>
                    <textarea id="json-input" placeholder="Paste your raw JSON text here or drag & drop a .json file..." spellcheck="false"></textarea>
                    
                    <div class="drag-overlay" id="drag-overlay">
                        <div class="drag-message">
                            <svg viewBox="0 0 24 24" width="48" height="48">
                                <path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                            </svg>
                            <h3>Drop JSON file here</h3>
                            <p>We'll load and parse it instantly</p>
                        </div>
                    </div>
                </div>

                <div class="pane-footer">
                    <div id="validation-alert" class="validation-banner valid">
                        <svg class="alert-icon" viewBox="0 0 24 24" width="16" height="16">
                            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <span id="validation-text">Waiting for input...</span>
                    </div>
                    <div class="stats-counter">
                        <span id="char-count">0 chars</span>
                        <span id="line-count">1 lines</span>
                    </div>
                </div>
            </section>

            <!-- Resizer divider handle -->
            <div class="split-divider" id="split-handle">
                <div class="divider-line"></div>
            </div>

            <!-- Right Pane: Output -->
            <section class="pane right-pane" id="output-pane">
                <div class="pane-header output-header">
                    <div class="output-tabs">
                        <button class="output-tab-btn active" data-output-tab="tab-highlight">Formatted JSON</button>
                        <button class="output-tab-btn" data-output-tab="tab-tree">Tree View</button>
                        <button class="output-tab-btn" data-output-tab="tab-yaml">YAML</button>
                        <button class="output-tab-btn" data-output-tab="tab-xml">XML</button>
                        <button class="output-tab-btn" data-output-tab="tab-csv">CSV</button>
                    </div>
                </div>

                <!-- Tab Panel Container -->
                <div class="output-body">
                    <!-- Formatted Highlighted Code Tab -->
                    <div id="tab-highlight" class="output-tab-panel active">
                        <div class="editor-container read-only">
                            <div class="line-numbers" id="output-line-numbers"><div>1</div></div>
                            <div id="output-highlighted" class="highlighted-view code-font" data-placeholder="Biçimlendirilmiş JSON burada görünecek..."></div>
                        </div>
                    </div>

                    <!-- Tree View Tab -->
                    <div id="tab-tree" class="output-tab-panel">
                        <div class="tree-toolbar">
                            <div class="tree-search-wrapper">
                                <input type="text" id="tree-search" placeholder="Search tree nodes..." spellcheck="false">
                                <span class="search-match-count" id="tree-match-count"></span>
                            </div>
                            <div class="tree-actions">
                                <button id="tree-expand-all" class="tree-action-btn">Expand All</button>
                                <button id="tree-collapse-all" class="tree-action-btn">Collapse All</button>
                            </div>
                        </div>
                        <div class="tree-container code-font" id="tree-view-root">
                            <div class="tree-placeholder">Format standard JSON to browse interactive nodes...</div>
                        </div>
                    </div>

                    <!-- YAML Output Tab -->
                    <div id="tab-yaml" class="output-tab-panel">
                        <div class="editor-container read-only">
                            <textarea id="output-yaml" readonly placeholder="YAML output..." spellcheck="false"></textarea>
                        </div>
                    </div>

                    <!-- XML Output Tab -->
                    <div id="tab-xml" class="output-tab-panel">
                        <div class="editor-container read-only">
                            <textarea id="output-xml" readonly placeholder="XML output..." spellcheck="false"></textarea>
                        </div>
                    </div>

                    <!-- CSV Output Tab -->
                    <div id="tab-csv" class="output-tab-panel">
                        <div class="editor-container read-only">
                            <textarea id="output-csv" readonly placeholder="CSV output (works best with JSON arrays of flat objects)..." spellcheck="false"></textarea>
                        </div>
                    </div>
                </div>

                <div class="pane-footer">
                    <div class="footer-actions">
                        <button id="copy-output" class="btn-primary-glow">
                            <svg viewBox="0 0 24 24" width="16" height="16">
                                <path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                            </svg>
                            <span>Copy to Clipboard</span>
                        </button>
                        <button id="download-output" class="btn-secondary-glow">
                            <svg viewBox="0 0 24 24" width="16" height="16">
                                <path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                            </svg>
                            <span>Download File</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <!-- History Sliding Panel -->
        <aside class="history-sidebar" id="history-sidebar">
            <div class="sidebar-header">
                <h2>Format History</h2>
                <button id="close-history" class="icon-close-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <div class="history-list" id="history-list-container">
                <!-- Populated dynamically -->
                <div class="history-empty">No formatted history yet.</div>
            </div>
            <div class="sidebar-footer">
                <button id="clear-history" class="btn-danger-outline">Clear History</button>
            </div>
        </aside>

        <!-- Overlay backdrop for sidebar -->
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <!-- Toast Notifications -->
        <div class="toast-container" id="toast-container"></div>
    </div>

    <script src="editor.js"></script>
</body>

</html>
